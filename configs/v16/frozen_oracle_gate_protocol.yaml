amendment:
  id: v16_missing_pesq_instrumentation_2026-07-26
  amended_at: '2026-07-26T11:30:45+01:00'
  supersedes_protocol_sha256: f0998458e0f758bf01741676b5dbc27d64ae6bc125b6251d6ec4de6822957357
  reason: >-
    Training item v16_dns_0237 produced no PESQ value at any candidate
    strength. Before model training or development evaluation, the
    metric-agnostic rule was frozen to exclude only a metric unavailable at
    every strength, renormalise the remaining fixed utility weights, require
    SI-SDR, STOI, and ESTOI, and record every omission. Partial metric
    availability still fails closed.
  labels_safely_checkpointed_before_failure: 1425
  development_set_used: false
  external_test_used: false

hypothesis: >-
  Candidate D failed because its unsupervised spectral controller saturated
  near full enhancement and its zero-strength path was not a true waveform
  bypass. A small causal controller trained on Pareto-safe, clean-reference
  oracle strengths can preserve Candidate A's VoiceBank quality while applying
  weaker enhancement where full strength harms cross-domain intelligibility.

candidate_budget:
  candidates: 1
  architecture_sweeps_permitted: false
  post_evaluation_retuning_permitted: false
  replication_condition: all_frozen_promotion_gates_pass
  failure_action: close_v16_and_write_postmortem

data_boundary:
  oracle_roles:
    - training
    - training_calibration
  oracle_development_data_permitted: false
  oracle_external_test_data_permitted: false
  corpus:
    voicebank_training: 1200
    voicebank_training_calibration: 200
    dns_training: 240
    dns_training_calibration: 60
    sample_rate: 16000
    fixed_duration_seconds: 4.0
  dns_policy: >-
    Every selected DNS clean and noise LFS object is disjoint from the frozen
    V15 cross-domain development assets. Asset selection was completed before
    downloading audio or computing any oracle score.
  voicebank_policy: >-
    Training and training-calibration speakers are disjoint. The frozen
    calibration speakers are p227 and p286; neither appears in V16 training.
  external_test_policy: >-
    The external test remains sealed. V16 candidate development and selection
    use only the named training, training-calibration, cross-domain development,
    and VoiceBank development sets.

oracle_target:
  policy: configs/v16/oracle_strength_policy.yaml
  strengths:
    - 0.0
    - 0.25
    - 0.5
    - 0.75
    - 1.0
  target_scope: one_strength_per_fixed_training_utterance
  clean_reference_available_at_inference: false
  oracle_metrics_are_deployable_claims: false
  resumable_checkpoint_every_items: 25
  missing_metric_rule: >-
    A metric unavailable at every strength is excluded and the remaining
    pre-frozen weights are renormalised. SI-SDR, STOI, and ESTOI must remain
    available; partial availability is an error.

model:
  architecture: causal_oracle_residual_gate_v16
  frozen_backbone: checkpoints/v15/preservation/quiet_level_seed1200/epoch_003.pt
  blend: noisy_plus_strength_times_backbone_minus_noisy
  exact_zero_strength_bypass: true
  exact_full_strength_endpoint: true
  gate_hidden_dim: 16
  gate_initial_strength: 0.75
  trainable_parameter_pattern:
    - confidence_gate
  maximum_gate_parameters: 10000
  causal: true
  constant_work_streaming: true

training:
  config: configs/v16/oracle_gate_seed16040.yaml
  seed: 16040
  epochs: 5
  early_stopping: false
  checkpoint_selection: minimum_training_calibration_gate_supervision_loss
  train_domain_sampling: equal_expected_voicebank_and_dns_probability
  random_crop: false
  clean_input_replacement: false
  oracle_supervision_loss: smooth_l1
  oracle_supervision_beta: 0.05
  auxiliary_regularisation:
    gate_smoothness_weight: 0.002
    waveform_l1_weight: 0.01
    si_sdr_weight: 0.001
    complex_stft_weight: 0.05

evaluation:
  candidate_checkpoint: checkpoints/v16/oracle_gate_seed16040/best.pt
  cross_domain_metadata: data/processed/dns_cross_domain_dev/metadata.csv
  voicebank_metadata: >-
    data/processed/voicebank_demand/metadata/v12_architecture_selection_400.csv
  cross_domain_reference: results/v15/cross_domain_dev/baselines_seed1200/v14_2
  voicebank_reference: results/v14/distillation/winner_dev400
  gates: configs/v15/promotion_gates.yaml
  bootstrap_samples: 20000
  bootstrap_seed: 16040
  runtime:
    native_streamer: V16NativeStreamer
    cpu_threads: 1
    measured_seconds: 10
  claims: development_only_until_external_test_is_authorised

execution:
  controller: scripts/run_v16_oracle_program.py
  ordered_stages:
    - prepare
    - labels
    - train
    - evaluate
  resumable:
    labels: true
    train: true
    evaluation: true
  execution_record: results/v16/oracle_gate_seed16040/execution_record.json


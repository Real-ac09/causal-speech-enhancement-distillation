project:
  name: cn-vqg-speech-enhancement
  seed: 10001
data:
  train_metadata: data/processed/voicebank_demand/metadata/train.csv
  val_metadata: data/processed/voicebank_demand/metadata/val_v51_search_100.csv
  sample_rate: 16000
  chunk_seconds: 4.0
  batch_size: 4
  num_workers: 8
  train_random_crop: true
model:
  architecture: causal_global_frequency_mamba_v10
  variant: student
  sample_rate: 16000
  n_fft: 512
  win_length: 320
  hop_length: 160
  magnitude_power: 0.3
  magnitude_mask_maximum: 2.0
  phase_residual_limit: 0.0
  use_mamba: true
  use_frequency_mamba: false
  use_noise_conditioning: false
  use_auxiliary_vq: false
  use_phase_detail: false
  v8_input_features: false
  frame_group_norm: true
  mamba_d_state: 16
  mamba_d_conv: 4
  mamba_expand: 2
  use_global_frequency_attention: false
  frequency_attention_dim: 40
  frequency_attention_heads: 4
  frequency_attention_expansion: 2
  frequency_residual_scale: 0.1
loss:
  waveform_l1_weight: 0.05
  waveform_charbonnier_eps: 0.001
  si_sdr_weight: 0.01
  stft_weight: 0.0
  vq_weight: 0.0
  mel_weight: 0.0
  complex_stft_weight: 0.5
  complex_stft_fft_sizes:
  - 512
  complex_stft_hop_sizes:
  - 160
  complex_stft_win_lengths:
  - 320
  complex_stft_complex_weight: 1.0
  complex_stft_log_mag_weight: 0.0
  complex_stft_compression_power: 0.3
  noise_prediction_weight: 0.0
  noise_spectrum_weight: 0.0
  magnitude_weight: 0.0
  magnitude_log_weight: 0.25
  magnitude_ratio_weight: 1.0
  magnitude_ratio_cap: 1.0
  magnitude_ratio_loss: l1
  magnitude_equal_loudness: false
  phase_weight: 0.0
  group_delay_weight: 0.0
  instantaneous_frequency_weight: 0.0
  compute_weight: 0.0
  tf_detail_n_fft: 512
  tf_detail_hop_length: 160
  tf_detail_win_length: 320
  tf_detail_center: false
  tf_detail_magnitude_power: 0.3
training:
  epochs: 4
  learning_rate: 0.0001
  weight_decay: 1.0e-05
  gradient_accumulation_steps: 2
  grad_clip_norm: 1.0
  precision: bf16
  log_every: 50
  val_every: 1
  checkpoint_metric: perceptual_enhanced_pesq
  checkpoint_mode: max
  optimizer:
    name: adamw
  lr_scheduler:
    name: none
  early_stopping:
    enabled: false
  perceptual_validation:
    enabled: true
    max_items: 100
  ema:
    enabled: false
  metricgan_lite:
    enabled: false
  save_every_epoch: false
  max_train_batches: 600
paths:
  checkpoint_dir: checkpoints/v10/v10_main
  experiment_name: control

project:
  name: cn-vqg-speech-enhancement
  seed: 42
data:
  train_metadata: data/processed/voicebank_demand/metadata/train.csv
  val_metadata: data/processed/voicebank_demand/metadata/val.csv
  sample_rate: 16000
  chunk_seconds: 4.0
  batch_size: 4
  num_workers: 2
model:
  architecture: hybrid_tf_refiner
  waveform_checkpoint: checkpoints/cnvqg_mamba_50m/best.pt
  waveform_model_config: null
  freeze_waveform: true
  sample_rate: 16000
  n_fft: 512
  hop_length: 128
  win_length: 512
  hidden_dim: 64
  temporal_layers: 4
  use_mamba: true
  mamba_d_state: 16
  mamba_d_conv: 4
  mamba_expand: 2
  predict_phase: true
  gain_scale: 0.2
  phase_scale: 0.08
  center: true
loss:
  waveform_l1_weight: 1.0
  si_sdr_weight: 0.5
  stft_weight: 1.0
  vq_weight: 0.25
  mel_weight: 0.2
  mel_sample_rate: 16000
  mel_n_fft: 512
  mel_hop_length: 160
  mel_win_length: 400
  mel_n_mels: 80
  mel_f_min: 50.0
  mel_f_max: 7600.0
  complex_stft_weight: 0.0
training:
  epochs: 10
  learning_rate: 5.0e-05
  weight_decay: 1.0e-05
  grad_clip_norm: 5.0
  mixed_precision: false
  log_every: 25
  val_every: 1
  max_train_batches: null
  max_val_batches: null
  lr_scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 2
    min_lr: 5.0e-06
  early_stopping:
    enabled: true
    patience: 4
    min_delta: 0.0001
  ema:
    enabled: false
    decay: 0.999
  metricgan_lite:
    enabled: false
paths:
  checkpoint_dir: checkpoints
  experiment_name: cnvqg_hybrid_tf_50m_teacher_stage1

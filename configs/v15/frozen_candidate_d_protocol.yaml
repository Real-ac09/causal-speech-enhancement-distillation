purpose: >-
  Test whether a tiny input-dependent causal residual gate can preserve
  cross-domain intelligibility without the PESQ and SI-SDR regressions caused
  by candidate B's global random identity-example intervention.
hypothesis:
  intervention: >-
    Freeze candidate A epoch 3 and train only a causal frame-level gate that
    blends between its enhanced spectrum and the noisy-input spectrum.
  evidence: >-
    Candidate B's benefit was strongly condition-dependent and its worst cases
    exhibited intermittent bypass-like behaviour. A global loss or identity
    probability is therefore insufficiently selective.

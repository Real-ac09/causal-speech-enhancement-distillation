project:
  name: cn-vqg-speech-enhancement
  seed: 42
data:
  train_metadata: data/processed/voicebank_demand/metadata/train.csv
  val_metadata: data/processed/voicebank_demand/metadata/val.csv
  sample_rate: 16000
  chunk_seconds: 4.0
  batch_size: 4
  num_workers: 4
model:
  architecture: streaming_hybrid_v2
  variant: student
  use_mamba: true
loss:
  waveform_l1_weight: 1.0
  si_sdr_weight: 0.3
  stft_weight: 1.0
  vq_weight: 0.1
  mel_weight: 0.15
  complex_stft_weight: 0.1
  noise_prediction_weight: 0.1
training:
  epochs: 40
  learning_rate: 0.00015
  weight_decay: 0.00001
  grad_clip_norm: 2.0
  mixed_precision: false
  log_every: 25
  val_every: 1
  optimizer:
    name: muon
    muon_learning_rate: 0.01
    adamw_learning_rate: 0.00015
    momentum: 0.95
    nesterov: true
    ns_steps: 5
  lr_scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 3
    min_lr: 0.000001
  early_stopping:
    enabled: true
    patience: 7
    min_delta: 0.0001
  ema:
    enabled: false
  metricgan_lite:
    enabled: false
paths:
  checkpoint_dir: checkpoints
  experiment_name: streaming_hybrid_v2_student_muon

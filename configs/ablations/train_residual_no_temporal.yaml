project:
  name: cn-vqg-speech-enhancement
  seed: 42
data:
  train_metadata: data/processed/voicebank_demand/metadata/train.csv
  val_metadata: data/processed/voicebank_demand/metadata/val.csv
  sample_rate: 16000
  chunk_seconds: 4.0
  batch_size: 4
  num_workers: 2
model:
  encoder_channels: 64
  latent_dim: 128
  speech_dim: 128
  noise_dim: 64
  codebook_size: 256
  temporal_hidden_dim: 128
  temporal_layers: 4
  use_mamba: false
  use_residual: true
  use_vq: true
  use_noise_conditioning: true
  use_temporal: false
loss:
  waveform_l1_weight: 1.0
  si_sdr_weight: 0.5
  stft_weight: 1.0
  vq_weight: 0.25
training:
  epochs: 10
  learning_rate: 0.0002
  weight_decay: 1.0e-05
  grad_clip_norm: 5.0
  mixed_precision: true
  log_every: 25
  val_every: 1
  max_train_batches: null
  max_val_batches: null
paths:
  checkpoint_dir: checkpoints
  experiment_name: cnvqg_residual_no_temporal

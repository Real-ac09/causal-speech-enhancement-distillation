project: {name: cn-vqg-speech-enhancement, seed: 42}
data:
  train_metadata: data/processed/voicebank_demand/metadata/train.csv
  val_metadata: data/processed/voicebank_demand/metadata/val.csv
  sample_rate: 16000
  chunk_seconds: 4.0
  batch_size: 8
  num_workers: 4
model:
  architecture: noise_adaptive_tf_mamba
  variant: xl
  sample_rate: 16000
  n_fft: 512
  hop_length: 128
  win_length: 512
  center: true
  magnitude_power: 0.3
  mask_max: 2.0
  max_iterations: 2
  use_mamba: true
  use_noise_codebook: false
  condition_dynamics: false
  adaptive_iterations: false
  phase_confidence: true
loss:
  waveform_l1_weight: 0.5
  si_sdr_weight: 0.1
  stft_weight: 0.5
  stft_fft_sizes: [256, 512, 1024]
  stft_hop_sizes: [64, 128, 256]
  stft_win_lengths: [256, 512, 1024]
  vq_weight: 0.0
  mel_weight: 0.2
  complex_stft_weight: 0.1
  noise_prediction_weight: 0.0
  magnitude_weight: 1.0
  phase_weight: 0.2
  phase_confidence_weight: 0.05
  compute_weight: 0.0
  tf_detail_n_fft: 512
  tf_detail_hop_length: 128
  tf_detail_win_length: 512
  tf_detail_center: true
  tf_detail_magnitude_power: 0.3
training:
  epochs: 10
  learning_rate: 0.00005
  weight_decay: 0.00001
  grad_clip_norm: 5.0
  precision: bf16
  log_every: 25
  val_every: 1
  checkpoint_metric: loss_total
  checkpoint_mode: min
  init_checkpoint: checkpoints/noise_adaptive_tf_mamba_v4_baseline_stage1_1iter/best.pt
  lr_scheduler: {name: reduce_on_plateau, factor: 0.5, patience: 2, min_lr: 0.000001}
  early_stopping: {enabled: true, patience: 3, min_delta: 0.0005}
  ema: {enabled: false}
  metricgan_lite: {enabled: false}
paths:
  checkpoint_dir: checkpoints
  experiment_name: noise_adaptive_tf_mamba_v4_baseline_stage2_2iter

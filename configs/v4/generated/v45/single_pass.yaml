project:
  name: cn-vqg-speech-enhancement
  seed: 4501
data:
  train_metadata: data/processed/voicebank_demand/metadata/train.csv
  val_metadata: data/processed/voicebank_demand/metadata/val_v51_search_100.csv
  sample_rate: 16000
  chunk_seconds: 4.0
  batch_size: 8
  num_workers: 8
model:
  architecture: causal_v43_recovery_v45
  variant: teacher
  sample_rate: 16000
  n_fft: 512
  win_length: 320
  hop_length: 160
  magnitude_power: 0.3
  channels: 144
  noise_dim: 96
  refinement_passes: 1
  magnitude_mode: bounded_mask
  codebook_size: 16
  vq_mode: disabled
  phase_residual_scale: 1.0
  use_mamba: true
  mamba_d_state: 16
  mamba_d_conv: 4
  mamba_expand: 2
loss:
  waveform_l1_weight: 0.5
  waveform_charbonnier_eps: 0.001
  si_sdr_weight: 0.1
  stft_weight: 0.5
  stft_fft_sizes:
  - 256
  - 512
  - 1024
  stft_hop_sizes:
  - 64
  - 128
  - 256
  stft_win_lengths:
  - 256
  - 512
  - 1024
  stft_spectral_convergence_weight: 1.0
  stft_log_mag_weight: 1.0
  stft_mag_l1_weight: 0.0
  mel_weight: 0.2
  complex_stft_weight: 0.1
  complex_stft_fft_sizes:
  - 512
  complex_stft_hop_sizes:
  - 160
  complex_stft_win_lengths:
  - 320
  complex_stft_complex_weight: 1.0
  complex_stft_log_mag_weight: 0.0
  complex_stft_compression_power: 0.3
  magnitude_weight: 1.0
  magnitude_equal_loudness: true
  phase_weight: 0.2
  group_delay_weight: 0.05
  instantaneous_frequency_weight: 0.05
  phase_confidence_weight: 0.05
  phase_confidence_temperature: 1.0
  vq_weight: 0.0
  noise_prediction_weight: 0.025
  noise_prediction_n_fft: 512
  noise_prediction_hop_length: 160
  noise_prediction_win_length: 320
  compute_weight: 0.0
  tf_detail_n_fft: 512
  tf_detail_hop_length: 160
  tf_detail_win_length: 320
  tf_detail_center: false
  tf_detail_magnitude_power: 0.3
training:
  epochs: 4
  learning_rate: 2.5e-05
  weight_decay: 1.0e-05
  gradient_accumulation_steps: 1
  grad_clip_norm: 5.0
  precision: bf16
  log_every: 100
  val_every: 1
  checkpoint_metric: perceptual_enhanced_pesq
  checkpoint_mode: max
  optimizer:
    name: muon
    muon_learning_rate: 0.0003
    adamw_learning_rate: 2.5e-05
    momentum: 0.95
    nesterov: true
    ns_steps: 5
    muon_weight_decay: 1.0e-05
  lr_scheduler:
    name: none
  early_stopping:
    enabled: false
  perceptual_validation:
    enabled: true
    max_items: 100
    whole_utterance: false
    phase_residual_scale: 0.0
    magnitude_residual_scale: 1.0
  ema:
    enabled: false
  metricgan_lite:
    enabled: false
  init_checkpoint: checkpoints/v44/full/causal_v43_recipe_full/best.pt
  init_strict: true
paths:
  checkpoint_dir: checkpoints/v45/search
  experiment_name: single_pass

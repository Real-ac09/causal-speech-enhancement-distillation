version: v17_recipe1
status: pre_training_freeze
objective: >-
  Test whether the frozen Candidate-A features can learn the five-level V16
  oracle controller after removing target imbalance, sigmoid saturation,
  padded audio, and silent-frame supervision.
controlled_changes_from_v16:
  retained:
    - candidate_a_backbone_checkpoint
    - frozen_backbone
    - true_waveform_residual_blend
    - causal_constant_work_controller
    - v16_training_and_calibration_audio
    - v16_utterance_oracle_targets
  changed:
    - five_class_softmax_controller_with_expected_strength
    - uniform_half_strength_initialisation
    - equal_domain_square_root_within_domain_class_sampler
    - valid_speech_frame_mask
    - classification_only_controller_objective
    - post_hoc_macro_selection_across_saved_epochs
strength_grid:
  - 0.0
  - 0.25
  - 0.5
  - 0.75
  - 1.0
training:
  seed: 17040
  epochs: 8
  checkpoint_every_epoch: true
  broad_development_evaluation_before_learnability_gate: false
learnability_gate:
  dns_target_correlation_minimum: 0.30
  macro_nearest_grid_accuracy_minimum: 0.35
  dns_target_mae_maximum: 0.20
  predicted_target_means_monotonic_tolerance: 0.02
  target_one_minus_zero_mean_minimum: 0.30
  voice_target_mae_maximum: 0.10
decision:
  pass: advance_selected_epoch_to_frozen_development_benchmarks
  fail: stop_recipe1_and_prepare_local_two_second_oracles

project:
  name: cn-vqg-speech-enhancement
  seed: 42
data:
  train_metadata: data/processed/voicebank_demand/metadata/train.csv
  val_metadata: data/processed/voicebank_demand/metadata/val.csv
  sample_rate: 16000
  chunk_seconds: 4.0
  batch_size: 4
  num_workers: 2
model:
  encoder_channels: 64
  latent_dim: 128
  speech_dim: 128
  noise_dim: 64
  codebook_size: 256
  temporal_hidden_dim: 128
  temporal_layers: 4
  use_mamba: true
  use_residual: true
  use_vq: true
  use_noise_conditioning: true
  use_temporal: true
  residual_scale_init: 0.2
  learn_residual_scale: false
loss:
  waveform_l1_weight: 1.0
  si_sdr_weight: 0.5
  stft_weight: 1.25
  vq_weight: 0.25
  stft_fft_sizes:
  - 256
  - 512
  - 1024
  - 2048
  stft_hop_sizes:
  - 64
  - 128
  - 256
  - 512
  stft_win_lengths:
  - 256
  - 512
  - 1024
  - 2048
  stft_spectral_convergence_weight: 1.0
  stft_log_mag_weight: 1.0
  stft_mag_l1_weight: 0.05
training:
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 1.0e-05
  grad_clip_norm: 5.0
  mixed_precision: false
  log_every: 25
  val_every: 1
  max_train_batches: null
  max_val_batches: null
  lr_scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 3
    min_lr: 1.0e-05
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.0001
paths:
  checkpoint_dir: checkpoints
  experiment_name: cnvqg_mamba_1m_opt_spec_b

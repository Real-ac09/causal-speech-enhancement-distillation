project:
  name: cn-vqg-speech-enhancement
  seed: 42
data:
  train_metadata: data/processed/voicebank_demand/metadata/train.csv
  val_metadata: data/processed/voicebank_demand/metadata/val.csv
  sample_rate: 16000
  chunk_seconds: 4.0
  batch_size: 4
  num_workers: 2
model:
  architecture: complex_cnvqg
  sample_rate: 16000
  n_fft: 512
  hop_length: 128
  win_length: 512
  hidden_dim: 128
  noise_dim: 64
  codebook_size: 128
  temporal_layers: 4
  use_mamba: true
  mamba_d_state: 16
  mamba_d_conv: 4
  mamba_expand: 2
  mask_scale: 0.5
  center: true
  commitment_weight: 0.25
loss:
  waveform_l1_weight: 1.0
  si_sdr_weight: 0.5
  stft_weight: 1.0
  vq_weight: 0.25
  mel_weight: 0.2
  mel_sample_rate: 16000
  mel_n_fft: 512
  mel_hop_length: 160
  mel_win_length: 400
  mel_n_mels: 80
  mel_f_min: 50.0
  mel_f_max: 7600.0
  complex_stft_weight: 0.025
  complex_stft_fft_sizes:
  - 512
  - 1024
  complex_stft_hop_sizes:
  - 128
  - 256
  complex_stft_win_lengths:
  - 512
  - 1024
  complex_stft_complex_weight: 1.0
  complex_stft_log_mag_weight: 0.5
training:
  epochs: 12
  learning_rate: 2.0e-05
  weight_decay: 1.0e-05
  grad_clip_norm: 5.0
  mixed_precision: false
  log_every: 25
  val_every: 1
  max_train_batches: null
  max_val_batches: null
  lr_scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 2
    min_lr: 5.0e-06
  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.0001
  ema:
    enabled: false
    decay: 0.999
  metricgan_lite:
    enabled: false
  init_checkpoint: checkpoints/cnvqg_complex_1m_mel_020_phase4a/best.pt
paths:
  checkpoint_dir: checkpoints
  experiment_name: cnvqg_complex_1m_phase4b_cx_0025_ft

project:
  name: cn-vqg-speech-enhancement
  seed: 1401

data:
  train_metadata: data/processed/voicebank_demand/metadata/train.csv
  val_metadata: data/processed/voicebank_demand/metadata/v12_epoch_selection_100.csv
  full_val_metadata: data/processed/voicebank_demand/metadata/v12_architecture_selection_400.csv
  sample_rate: 16000
  chunk_seconds: 4.0
  batch_size: 8
  num_workers: 8
  train_random_crop: true
  clean_input_probability: 0.10

model:
  architecture: causal_confidence_gate_v14
  backbone_checkpoint: checkpoints/v12/full/gru_matched_time1_seed1200/best.pt
  gate_hidden_dim: 16
  gate_minimum_strength: 0.0
  gate_initial_strength: 0.995
  gate_parameter_cap: 10000

loss:
  waveform_l1_weight: 0.05
  waveform_charbonnier_eps: 0.001
  si_sdr_weight: 0.01
  stft_weight: 0.0
  vq_weight: 0.0
  mel_weight: 0.0
  complex_stft_weight: 0.5
  complex_stft_fft_sizes:
    - 512
  complex_stft_hop_sizes:
    - 160
  complex_stft_win_lengths:
    - 320
  complex_stft_complex_weight: 1.0
  complex_stft_log_mag_weight: 0.0
  complex_stft_compression_power: 0.3
  noise_prediction_weight: 0.0
  noise_spectrum_weight: 0.0
  magnitude_weight: 0.0
  magnitude_log_weight: 0.25
  magnitude_ratio_weight: 1.0
  magnitude_ratio_cap: 1.0
  magnitude_ratio_loss: l1
  magnitude_ratio_charbonnier_eps: 0.001
  magnitude_equal_loudness: false
  phase_weight: 0.0
  group_delay_weight: 0.0
  instantaneous_frequency_weight: 0.0
  phase_confidence_weight: 0.0
  compute_weight: 0.0
  tf_detail_n_fft: 512
  tf_detail_hop_length: 160
  tf_detail_win_length: 320
  tf_detail_center: false
  tf_detail_magnitude_power: 0.3
  gate_identity_weight: 0.02
  gate_identity_snr_threshold_db: 15.0
  gate_identity_snr_temperature_db: 2.0
  gate_smoothness_weight: 0.005

training:
  epochs: 16
  learning_rate: 0.0005
  weight_decay: 0.00001
  gradient_accumulation_steps: 1
  grad_clip_norm: 1.0
  precision: bf16
  log_every: 100
  val_every: 1
  trainable_parameter_patterns:
    - confidence_gate
  checkpoint_metric: perceptual_enhanced_pesq
  checkpoint_mode: max
  checkpoint_safeguards:
    baseline_summary: results/v14/blend_screen_seed1200/strength_100/summary.json
    max_si_sdr_drop: 0.10
    max_stoi_drop: 0.001
    max_estoi_drop: 0.002
  optimizer:
    name: adamw
  lr_scheduler:
    name: warmup_cosine
    warmup_epochs: 1
    minimum_factor: 0.05
  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.003
  perceptual_validation:
    enabled: true
    max_items: 100
    whole_utterance: true
  ema:
    enabled: false
  metricgan_lite:
    enabled: false
  save_every_epoch: false

paths:
  checkpoint_dir: checkpoints/v14
  experiment_name: gate_seed1200

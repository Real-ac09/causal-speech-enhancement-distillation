project: {name: cn-vqg-speech-enhancement, seed: 42}
data:
  train_metadata: data/processed/voicebank_demand/metadata/train.csv
  val_metadata: data/processed/voicebank_demand/metadata/val.csv
  sample_rate: 16000
  chunk_seconds: 4.0
  batch_size: 12
  num_workers: 4
model:
  architecture: streaming_hybrid_v3
  variant: student
  use_mamba: true
  encoder_type: lookahead
  decoder_type: lookahead_transpose
  tf_condition_dim: 12
  enable_tf_refiner: true
  vq_update_interval: 2
  vq_decay: 0.99
  residual_scale: 0.2
  gain_scale: 0.2
  phase_scale: 0.05
loss:
  waveform_l1_weight: 1.0
  si_sdr_weight: 0.5
  stft_weight: 0.8
  stft_fft_sizes: [256, 512, 1024]
  stft_hop_sizes: [64, 128, 256]
  stft_win_lengths: [256, 512, 1024]
  vq_weight: 0.1
  mel_weight: 0.2
  complex_stft_weight: 0.05
  noise_prediction_weight: 0.05
training:
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.00001
  grad_clip_norm: 2.0
  precision: bf16
  log_every: 25
  val_every: 1
  checkpoint_metric: loss_si_sdr
  checkpoint_mode: min
  optimizer:
    name: muon
    muon_learning_rate: 0.001
    adamw_learning_rate: 0.00005
  lr_scheduler: {name: reduce_on_plateau, factor: 0.5, patience: 3, min_lr: 0.000001}
  early_stopping: {enabled: true, patience: 8, min_delta: 0.01}
  ema: {enabled: false}
  metricgan_lite: {enabled: false}
paths:
  checkpoint_dir: checkpoints
  experiment_name: streaming_hybrid_v3_student

# Optional final perceptual stage. Run only after the BF16 joint model has
# established SI-SDR/STOI quality. MetricGAN-lite remains FP32 for stability.
project: {name: cn-vqg-speech-enhancement, seed: 42}
data:
  train_metadata: data/processed/voicebank_demand/metadata/train.csv
  val_metadata: data/processed/voicebank_demand/metadata/val.csv
  sample_rate: 16000
  chunk_seconds: 4.0
  batch_size: 8
  num_workers: 4
model:
  architecture: streaming_hybrid_v3
  variant: teacher
  use_mamba: true
  encoder_type: lookahead
  decoder_type: lookahead_transpose
  tf_condition_dim: 12
  enable_tf_refiner: true
  vq_update_interval: 2
  vq_decay: 0.99
  residual_scale: 0.2
  gain_scale: 0.2
  phase_scale: 0.05
loss:
  waveform_l1_weight: 1.0
  si_sdr_weight: 0.5
  stft_weight: 0.7
  stft_fft_sizes: [256, 512, 1024]
  stft_hop_sizes: [64, 128, 256]
  stft_win_lengths: [256, 512, 1024]
  vq_weight: 0.05
  mel_weight: 0.25
  complex_stft_weight: 0.05
  noise_prediction_weight: 0.025
training:
  epochs: 12
  learning_rate: 0.000002
  weight_decay: 0.00001
  grad_clip_norm: 2.0
  precision: fp32
  log_every: 25
  val_every: 1
  checkpoint_metric: loss_si_sdr
  checkpoint_mode: min
  init_checkpoint: checkpoints/streaming_hybrid_v3_teacher_joint/best.pt
  lr_scheduler: {name: reduce_on_plateau, factor: 0.5, patience: 2, min_lr: 0.00000025}
  early_stopping: {enabled: true, patience: 4, min_delta: 0.005}
  ema: {enabled: false}
  metricgan_lite:
    enabled: true
    metric_weight: 0.005
    quality_learning_rate: 0.0001
    quality_weight_decay: 0.0001
    quality_grad_clip_norm: 5.0
    channels: 32
    kernel_size: 15
    dropout: 0.1
paths:
  checkpoint_dir: checkpoints
  experiment_name: streaming_hybrid_v3_teacher_quality_ft

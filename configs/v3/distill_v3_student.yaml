teacher_checkpoint: checkpoints/streaming_hybrid_v3_teacher_joint/best.pt
data:
  train_metadata: data/processed/voicebank_demand/metadata/train.csv
  val_metadata: data/processed/voicebank_demand/metadata/val.csv
  sample_rate: 16000
  chunk_seconds: 4.0
  batch_size: 8
  num_workers: 4
student_model:
  architecture: streaming_hybrid_v3
  variant: student
  use_mamba: true
  encoder_type: lookahead
  decoder_type: lookahead_transpose
  tf_condition_dim: 12
  enable_tf_refiner: true
  vq_update_interval: 2
  vq_decay: 0.99
  residual_scale: 0.2
  gain_scale: 0.2
  phase_scale: 0.05
loss:
  waveform_l1_weight: 1.0
  si_sdr_weight: 0.5
  stft_weight: 0.8
  stft_fft_sizes: [256, 512, 1024]
  stft_hop_sizes: [64, 128, 256]
  stft_win_lengths: [256, 512, 1024]
  vq_weight: 0.1
  mel_weight: 0.2
  complex_stft_weight: 0.05
  noise_prediction_weight: 0.05
distillation:
  waveform_weight: 0.3
  spectrum_weight: 0.3
  gain_weight: 0.1
  phase_weight: 0.05
  speech_feature_weight: 0.1
  noise_feature_weight: 0.1
  noise_prediction_weight: 0.05
training:
  epochs: 40
  learning_rate: 0.0001
  weight_decay: 0.00001
  precision: bf16
  distillation_warmup_epochs: 4
  checkpoint_metric: supervised
  early_stopping:
    enabled: true
    patience: 8
    min_delta: 0.001
paths:
  checkpoint_dir: checkpoints
  experiment_name: streaming_hybrid_v3_student_distilled

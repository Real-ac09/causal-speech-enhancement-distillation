[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnvqg"
version = "0.1.0"
description = "Causal Noise-State Vector-Quantised Gating Network for speech enhancement"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Mohamed Bseikri" }
]

[tool.setuptools.packages.find]
where = ["src"]
